name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install Qt runtime
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pandas openpyxl numpy PySide6 pyqtgraph pyarrow psutil pytest pytest-qt
      - name: Test converter and canonical Parquet pipeline
        run: >-
          python -m pytest tests/test_converter.py tests/test_pipeline_parquet.py
          -q --tb=short --junitxml=test-results/core.xml
      - name: Test graphical interface and interactions
        run: >-
          python -m pytest tests/test_gui.py tests/test_graficos.py
          -q --tb=short --junitxml=test-results/gui.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-reports
          path: test-results/*.xml
